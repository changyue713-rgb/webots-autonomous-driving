[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elec5308-autonomy"
version = "0.1.0"
description = "Autonomous vehicle perception and navigation system for ELEC5308"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Group 1" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=9.5.0",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.3",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mkdocs",
    "mkdocstrings[python]",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]

# Pyflakes (unused variables, undefined names), the error-level pycodestyle
# checks, and isort for import ordering. Deliberately excludes the more
# opinionated style rules so CI fails on genuine problems rather than
# formatting preferences.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Webots launches these scripts directly rather than importing the installed
# package, so they must modify sys.path before importing elec5308_autonomy.
# Imports cannot come first here, so E402 does not apply.
"webots/controllers/*" = ["E402"]
"controller/*" = ["E402"]